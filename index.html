<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F5EF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Slab Ledger</title>
<style>
  :root{
    --paper:#F7F5EF;
    --card:#FFFFFF;
    --ink:#1C2530;
    --soft:#6B7480;
    --rule:#E4E0D6;
    --blue:#1F4E8C;
    --blue-press:#173a68;
    --green:#2E7D5B;
    --red:#B03A2E;
    --red-press:#8f2d23;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex;flex-direction:column;height:100vh;height:100dvh;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }

  header{
    flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:12px;background:var(--paper);
  }
  .brand{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:21px;font-weight:600;
  }
  .brand .dot{color:var(--blue)}
  .tally{margin-left:auto;text-align:right;line-height:1.25}
  #count{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;display:block}
  #total{font-size:16px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  .actions{flex:none;display:flex;padding:12px 18px}
  button{
    font:inherit;font-weight:600;font-size:15px;
    border:0;border-radius:10px;padding:14px 16px;cursor:pointer;
    background:var(--blue);color:#fff;
  }
  button:active{background:var(--blue-press)}
  .scan{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px}
  .scan.armed{background:var(--green)}
  .scan svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}

  .head{
    flex:none;display:flex;padding:6px 18px;border-bottom:1px solid var(--rule);
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:600;
  }
  .head .h-cert{flex:1}
  .head .h-paid{width:118px;text-align:right}
  .head .h-x{width:36px}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .rowline{
    display:flex;align-items:center;padding:0 18px;
    border-bottom:1px solid var(--rule);background:var(--paper);
  }
  .rowline:nth-child(even){background:#FBFAF6}
  .cell{
    padding:14px 2px;outline:none;-webkit-user-select:text;user-select:text;
    font-variant-numeric:tabular-nums;
  }
  .c-cert{flex:1;font-size:20px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
  .c-cert:empty::before{content:"—";color:var(--rule);font-weight:400}
  .c-paid{width:118px;text-align:right;color:var(--ink);font-weight:700;font-size:20px}
  .c-paid .pre{color:var(--soft);font-weight:600}
  .c-paid:empty::before{content:"add $";color:var(--soft);font-weight:400;font-size:14px}
  .cell:focus{background:#FFF7DE;border-radius:5px}
  .c-x{width:36px;display:flex;align-items:center;justify-content:flex-end}
  .c-x button{background:none;color:var(--red);padding:12px 2px 12px 12px;font-size:16px;font-weight:400}

  .empty{padding:56px 30px;text-align:center;color:var(--soft);font-size:15px;line-height:1.7}
  .empty b{color:var(--blue)}

  /* modals */
  .modal-bg{
    position:fixed;inset:0;background:rgba(28,37,48,.34);z-index:30;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);width:100%;max-width:340px;border-radius:16px;
    padding:22px 22px 20px;box-shadow:0 20px 50px rgba(28,37,48,.28);
  }
  .modal .lab{font-size:13px;color:var(--soft);margin-bottom:3px}
  .modal .cert-echo{font-size:15px;color:var(--ink);margin-bottom:18px;font-variant-numeric:tabular-nums;font-weight:600}
  .amount{
    display:flex;align-items:center;gap:8px;
    border:1.5px solid var(--rule);border-radius:12px;padding:14px 18px;margin-bottom:18px;
  }
  .amount:focus-within{border-color:var(--blue)}
  .amount .sym{font-size:30px;color:var(--soft);font-weight:700}
  .amount input{
    border:0;outline:none;font:inherit;font-size:34px;font-weight:700;width:100%;
    background:none;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .modal-btns{display:flex;gap:10px}
  .modal-btns button{flex:1}
  .modal-btns .skip{background:var(--card);border:1px solid var(--rule);color:var(--soft);font-weight:500}

  /* delete confirm */
  .del-modal .warn{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .del-modal .sub{font-size:14px;color:var(--soft);margin-bottom:6px}
  .del-modal .which{
    font-size:18px;font-weight:700;color:var(--red);margin-bottom:18px;
    font-variant-numeric:tabular-nums;word-break:break-all;
  }
  .del-modal .go{background:var(--red)}
  .del-modal .go:active{background:var(--red-press)}

  #trap{position:absolute;opacity:0;pointer-events:none;height:0;width:0}

  .foot{flex:none;display:flex;padding:11px 18px;border-top:1px solid var(--rule);background:var(--paper)}
  .foot button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--rule);font-weight:500}
  .foot button:active{background:#efece4}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="brand">Slab Ledger<span class="dot">.</span></span>
  <span class="tally">
    <span id="count">0 cards</span>
    <span id="total">$0</span>
  </span>
</header>

<div class="actions">
  <button class="scan" id="scanBtn">
    <svg viewBox="0 0 24 24"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14"/></svg>
    <span id="scanLabel">Scan slab</span>
  </button>
</div>

<div class="head">
  <div class="h-cert">Cert number</div>
  <div class="h-paid">Paid</div>
  <div class="h-x"></div>
</div>

<div class="scroll" id="scroll">
  <div class="empty" id="empty">
    Tap <b>Scan slab</b> and scan a PSA barcode.<br>
    Each cert lands here — enter what you paid, and keep scanning.
  </div>
</div>

<div class="foot">
  <button id="copyBtn">Copy for spreadsheet</button>
</div>

<input id="trap" autocomplete="off" inputmode="none">

<!-- paid entry -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="lab">How much did you pay?</div>
    <div class="cert-echo" id="modalCert">Cert —</div>
    <div class="amount">
      <span class="sym">$</span>
      <input id="paidInput" type="text" inputmode="decimal" placeholder="0.00">
    </div>
    <div class="modal-btns">
      <button class="skip" id="skipPaid">Skip</button>
      <button id="savePaid">Confirm</button>
    </div>
  </div>
</div>

<!-- delete confirm -->
<div class="modal-bg" id="delBg">
  <div class="modal del-modal">
    <div class="warn">Delete this row?</div>
    <div class="sub">This can't be undone.</div>
    <div class="which" id="delWhich">Cert —</div>
    <div class="modal-btns">
      <button class="skip" id="delCancel">Keep</button>
      <button class="go" id="delGo">Delete</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STORE = "slabLedger.rows";

let rows = load();
let uid = rows.reduce((m,r)=>Math.max(m,r.id),0);
let armed = false;
let pendingId = null;   // row awaiting paid amount
let deleteId = null;    // row awaiting delete confirm

function save(){ try{ localStorage.setItem(STORE, JSON.stringify(rows)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)||"[]"); }catch(e){ return []; } }

function render(){
  const s=$("scroll");
  s.querySelectorAll(".rowline").forEach(n=>n.remove());
  $("empty").style.display = rows.length? "none":"block";

  const n=rows.length;
  $("count").textContent = n + (n===1?" card":" cards");
  const sum=rows.reduce((t,r)=>t + (parseFloat(r.paid)||0), 0);
  $("total").textContent = "$" + sum.toLocaleString(undefined,{minimumFractionDigits: sum%1?2:0, maximumFractionDigits:2});

  const frag=document.createDocumentFragment();
  rows.forEach(r=>{
    const div=document.createElement("div");
    div.className="rowline";
    div.innerHTML=
      '<div class="cell c-cert" data-f="cert" data-id="'+r.id+'" contenteditable>'+esc(r.cert)+'</div>'+
      '<div class="cell c-paid" data-f="paid" data-id="'+r.id+'" contenteditable>'+
        (r.paid?'<span class="pre">$</span>'+esc(r.paid):'')+'</div>'+
      '<div class="c-x"><button data-del="'+r.id+'">✕</button></div>';
    frag.appendChild(div);
  });
  s.appendChild(frag);
}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

$("scroll").addEventListener("focusout", e=>{
  const el=e.target.closest("[data-id]"); if(!el)return;
  const r=rows.find(x=>x.id==el.dataset.id); if(!r)return;
  let txt=el.textContent.replace(/\$/g,"").trim();
  if(el.dataset.f==="cert") r.cert=txt.replace(/\D/g,"");
  else r.paid=txt.replace(/[^\d.]/g,"");
  save(); render();
});

/* delete goes through a confirm modal */
$("scroll").addEventListener("click", e=>{
  const d=e.target.closest("[data-del]");
  if(d){ askDelete(d.dataset.del); }
});
function askDelete(id){
  deleteId=id;
  const r=rows.find(x=>x.id==id);
  $("delWhich").textContent = r && r.cert ? ("Cert "+r.cert) : "This row";
  $("delBg").classList.add("show");
}
$("delGo").onclick=()=>{
  rows=rows.filter(x=>x.id!=deleteId);
  save(); render();
  $("delBg").classList.remove("show"); deleteId=null;
  if(armed) rearm();
};
$("delCancel").onclick=()=>{ $("delBg").classList.remove("show"); deleteId=null; if(armed) rearm(); };
$("delBg").addEventListener("click",e=>{ if(e.target===$("delBg")) $("delCancel").click(); });

/* scan adds a row */
function addCert(cert){
  const r={id:++uid, cert:cert, paid:""};
  rows.unshift(r); save(); render();
  openPaid(r.id, cert);
}

/* paid modal */
function openPaid(id, cert){
  pendingId=id;
  $("modalCert").textContent="Cert "+cert;
  $("paidInput").value="";
  $("modalBg").classList.add("show");
  setTimeout(()=>$("paidInput").focus(),80);
}
function closePaid(){ $("modalBg").classList.remove("show"); pendingId=null; if(armed) rearm(); }

$("savePaid").onclick=()=>{
  const v=$("paidInput").value.replace(/[^\d.]/g,"");
  const r=rows.find(x=>x.id==pendingId);
  if(r){ r.paid=v; save(); render(); }
  closePaid();
};
$("skipPaid").onclick=closePaid;
$("paidInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();$("savePaid").click();} });
$("modalBg").addEventListener("click",e=>{ if(e.target===$("modalBg")) closePaid(); });

/* scanner */
function rearm(){ const t=$("trap"); t.value=""; t.focus(); }
function arm(){
  armed=true;
  $("scanLabel").textContent="Ready";
  $("scanBtn").classList.add("armed");
  rearm();
}
function disarm(){
  armed=false;
  $("scanLabel").textContent="Scan slab";
  $("scanBtn").classList.remove("armed");
  $("trap").blur();
}
$("trap").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    const code=$("trap").value.trim().replace(/\D/g,"");
    $("trap").value="";
    if(code){ if(navigator.vibrate)navigator.vibrate(28); addCert(code); }
  }
});
$("trap").addEventListener("blur", ()=>{
  if(armed && !pendingId && !deleteId) setTimeout(()=>{if(armed&&!pendingId&&!deleteId)$("trap").focus();},60);
});

$("scanBtn").onclick=()=> armed?disarm():arm();

$("copyBtn").onclick=async ()=>{
  if(!rows.length) return;
  const ordered=[...rows].reverse();
  const tsv=["Cert Number\tPaid",
    ...ordered.map(r=>[r.cert||"", r.paid?("$"+r.paid):""].join("\t"))].join("\n");
  try{ await navigator.clipboard.writeText(tsv); }
  catch(e){ const ta=document.createElement("textarea");ta.value=tsv;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove(); }
  const btn=$("copyBtn"), was=btn.textContent;
  btn.textContent="Copied "+rows.length+" rows";
  setTimeout(()=>btn.textContent=was,1600);
};

document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&armed&&!pendingId&&!deleteId)$("trap").focus(); });

render();
</script>
</body>
</html>
